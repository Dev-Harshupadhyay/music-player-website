<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पुरानी यादें — Music Player</title>
<style>
  :root{
    --accent:#ff9800;
    --glass:rgba(24,24,24,0.68);
    --glass-strong:rgba(16,14,13,0.82);
    --border:rgba(255,255,255,0.12);
    --text-dim:#cfc9c3;
    --bg-base:#151008;
    --text-color:#fff;
    --footer-bg:rgba(0,0,0,.5);
  }

  body.dark-mode {
    --accent:#00e5ff;
    --glass:rgba(15,23,42,0.75);
    --glass-strong:rgba(10,15,30,0.88);
    --border:rgba(255,255,255,0.08);
    --text-dim:#94a3b8;
    --bg-base:#090d16;
    --text-color:#f8fafc;
    --footer-bg:rgba(10,15,30,0.6);
  }

  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  html,body{height:100%;}
  body{
    color:var(--text-color);
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow-x:hidden; position:relative;
    background:var(--bg-base);
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ── Rotating illustrated backdrop ─────────────────────── */
  .bg-layer{
    position:fixed; inset:0;
    background-size:cover; background-position:center;
    transition:opacity 1.2s ease, filter 1.2s ease;
    opacity:0; z-index:0;
  }
  .bg-layer.is-active{opacity:1;}
  body::after{
    content:''; position:fixed; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(10,7,5,.45), rgba(10,7,5,.72) 55%, rgba(6,4,3,.92));
    transition: background 0.3s ease;
  }
  body.dark-mode::after{
    background:linear-gradient(180deg, rgba(5,7,15,.55), rgba(5,7,15,.82) 55%, rgba(2,4,8,.95));
  }

  header, .status-row, main, .list-wrap, .player-dock, footer{position:relative; z-index:5; width:100%; display:flex; justify-content:center;}

  /* ── Status row (clock / night-mode / icons) ───────────── */
  .status-row{padding:18px 20px 0; justify-content:space-between; max-width:560px; margin:0 auto;}
  .status-left{display:flex; align-items:center; gap:10px;}
  .clock{font-size:26px; font-weight:800; letter-spacing:.5px;}
  .icon-pill{
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; cursor:pointer; transition:background .2s;
  }
  .icon-pill:hover{background:rgba(255,255,255,.16);}
  .icon-pill.is-on{background:var(--accent); color:#111;}
  .status-right{display:flex; align-items:center; gap:10px;}

  /* ── Live listeners ─────────────────────────────────────── */
  .live-row{padding:10px 20px 0; justify-content:center;}
  .live-pill{
    display:flex; align-items:center; gap:8px;
    font-size:14px; color:var(--text-dim); font-weight:600;
  }
  .live-dot{width:9px; height:9px; border-radius:50%; background:#3ddc73; box-shadow:0 0 8px #3ddc73; flex-shrink:0;}

  /* ── Hero ────────────────────────────────────────────────── */
  .hero{flex-direction:column; align-items:center; text-align:center; padding:18px 20px 6px;}
  .hero h1{
    font-size:clamp(34px,9vw,58px); font-weight:900;
    text-shadow:0 6px 24px rgba(0,0,0,.9);
    letter-spacing:.5px; line-height:1.1;
    background:linear-gradient(180deg,#fff 10%,#ffe3b8 60%,var(--accent) 130%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    transition:opacity .22s ease, transform .22s ease;
  }
  .hero h1.is-fading{opacity:0; transform:translateY(-8px);}
  body.dark-mode .hero h1{background:linear-gradient(180deg,#fff 10%,#bff3ff 60%,var(--accent) 130%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}

  /* ── Tabs ───────────────────────────────────────────────── */
  .tabs{
    display:flex; gap:8px; margin-top:18px; background:var(--glass); padding:8px;
    border-radius:26px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border); transition:background 0.3s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    max-width:94vw; overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    display:flex; align-items:center; gap:8px;
    padding:7px 18px 7px 7px; font-size:13px; font-weight:700; border:none;
    border-radius:20px; cursor:pointer; background:transparent; color:var(--text-dim);
    white-space:nowrap; flex-shrink:0;
    transition:background .3s cubic-bezier(.34,1.56,.64,1), color .25s ease, box-shadow .3s ease, transform .12s cubic-bezier(.34,1.56,.64,1);
  }
  .tab-btn:active{transform:scale(.93);}
  .tab-btn.is-bouncing{animation:tabPop .45s cubic-bezier(.34,1.56,.64,1);}
  @keyframes tabPop{
    0%{transform:scale(1);}
    35%{transform:scale(1.14);}
    60%{transform:scale(.95);}
    100%{transform:scale(1);}
  }
  .tab-btn.active{background:var(--accent); color:#111; box-shadow:0 6px 16px rgba(255,152,0,.4);}
  .tab-thumb{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .tab-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .tab-btn.active .tab-thumb{border-color:rgba(0,0,0,.35);}
  .tab-btn--plain{padding:9px 20px;}

  /* ── Track list (glass card, pill highlight) ───────────── */
  .list-wrap{max-width:560px; padding:16px 16px 0; flex-direction:column;}
  .playlist-drawer{
    background:var(--glass); backdrop-filter:blur(18px);
    border:1px solid var(--border); border-radius:24px;
    width:100%; max-height:0; overflow:hidden;
    transition:max-height .45s ease, padding .45s ease, opacity .3s ease, background 0.3s ease;
    opacity:0; padding:0 6px;
  }
  .playlist-drawer.is-open{max-height:380px; overflow-y:auto; padding:8px; opacity:1;}
  .track-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; border-radius:16px; cursor:pointer;
    transition:background .2s ease;
  }
  .track-row:hover{background:rgba(255,255,255,.06);}
  .track-row.is-current{background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 1px var(--accent);}
  .t-title{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto;}
  .t-artist{font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 0 auto; max-width:42%; text-align:right;}
  .track-row.is-current .t-title, .track-row.is-current .t-artist{color:var(--text-color);}

  /* ── Sticky bottom player ───────────────────────────────── */
  .player-dock{padding:16px 16px 10px; margin-top:14px;}
  .player-card{
    background:var(--glass-strong); backdrop-filter:blur(20px);
    border:1px solid var(--border); border-radius:32px;
    width:100%; max-width:560px; padding:16px 20px 18px;
    box-shadow:0 18px 44px rgba(0,0,0,.65);
    display:flex; flex-direction:column; gap:12px;
    transition: background 0.3s ease;
  }
  .now-playing-row{display:flex; align-items:center; gap:14px;}
  .cover-wrap{width:58px; height:58px; border-radius:50%; flex-shrink:0; overflow:hidden; border:2px solid rgba(255,255,255,.25); box-shadow:0 6px 16px rgba(0,0,0,.5);}
  .cover-img{width:100%; height:100%; object-fit:cover; display:block;}
  .track-details{flex:1 1 auto; overflow:hidden; text-align:left;}
  .marquee{overflow:hidden; white-space:nowrap; position:relative;}
  .marquee-inner{display:inline-block; white-space:nowrap;}
  .marquee.is-scrolling .marquee-inner{animation:scrollText 9s linear infinite;}
  @keyframes scrollText{0%,15%{transform:translateX(0);}85%,100%{transform:translateX(calc(-100% + 220px));}}
  .track-details h4{font-size:15px; font-weight:700;}
  .track-details p{font-size:12px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .track-details.is-fading, .cover-img.is-fading{opacity:0; transform:translateY(2px);}
  .track-details, .cover-img{transition:opacity .22s ease, transform .22s ease;}

  .seek-row{display:flex; align-items:center; gap:8px;}
  .seek-time{font-size:11px; color:var(--text-dim); min-width:32px;}
  .seek-time.dur{text-align:right;}
  .seek-track{flex-grow:1; height:5px; border-radius:4px; background:rgba(255,255,255,.18); position:relative; cursor:pointer;}
  .seek-fill{position:absolute; inset:0; width:0%; background:var(--accent); border-radius:4px; transition:width .15s linear;}

  .controls-group{display:flex; align-items:center; justify-content:space-between; padding:0 4px;}
  .ctrl-btn{background:none; border:none; color:var(--text-color); font-size:19px; cursor:pointer; padding:6px; opacity:.85; transition:opacity .2s, transform .2s;}
  .ctrl-btn:hover{opacity:1; transform:scale(1.08);}
  .ctrl-btn.is-on{color:var(--accent); opacity:1;}
  .play-btn{
    background:var(--text-color); color:var(--bg-base); width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:21px; border:none; cursor:pointer; flex-shrink:0;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transition:transform .15s ease, background 0.3s ease, color 0.3s ease;
  }
  .play-btn:hover{transform:scale(1.06);}
  .play-btn:disabled{opacity:.5; cursor:wait;}
  .queue-btn{position:relative;}
  .list-count{position:absolute; top:-2px; right:-2px; font-size:9px; background:var(--accent); color:#111; font-weight:800; border-radius:9px; padding:1px 5px;}

  footer{padding:8px; margin-bottom:14px;}
  footer a{text-decoration:none;}
  footer span{font-size:12px; color:var(--text-dim); background:var(--footer-bg); padding:6px 18px; border-radius:20px; letter-spacing:1px; backdrop-filter:blur(6px); display:inline-block; transition:color 0.2s;}
  footer a:hover span{color:var(--text-color); background:rgba(255,255,255,0.15);}

  #yt-player-holder{position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;}

  @media (max-width:420px){
    .clock{font-size:22px;}
    .hero h1{font-size:clamp(28px,10vw,44px);}
  }
</style>
</head>
<body>

  <div class="bg-layer is-active" id="bgA" style="background-image:url('https://i.ibb.co/nMVLVCVy/image4.jpg')"></div>
  <div class="bg-layer" id="bgB"></div>

  <div class="status-row">
    <div class="status-left">
      <span class="clock" id="clock">--:--</span>
      <button class="icon-pill" id="nightBtn" title="Night mode">🌙</button>
    </div>
    <div class="status-right">
      <button class="icon-pill" id="repeatBtn" title="Repeat">🔁</button>
      <button class="icon-pill" id="ytBtn" title="Open on YouTube">▶</button>
    </div>
  </div>

  <div class="live-row">
    <div class="live-pill"><span class="live-dot"></span><span id="liveCount">27</span>&nbsp;सुन रहे हैं</div>
  </div>

  <main class="hero">
    <h1 id="heroTitle">पुरानी यादें</h1>
    <div class="tabs" id="tabsRow">
      <button class="tab-btn tab-btn--plain active" data-tab="playlists">
        <span class="tab-label">Playlists</span>
      </button>
      <button class="tab-btn tab-btn--plain" data-tab="singles">
        <span class="tab-label">Single Songs</span>
      </button>
      <button class="tab-btn" data-tab="bhakti">
        <span class="tab-thumb">
          <img src="https://i.ibb.co/SXHrsX8c/thumb.jpg" alt="Bhakti Song" onerror="this.remove(); this.parentElement.textContent='🙏';">
        </span>
        <span class="tab-label">Bhakti Song</span>
      </button>
      <button class="tab-btn" data-tab="bhojpuri">
        <span class="tab-thumb">
          <img src="https://i.ibb.co/BV7srt6L/thumb.jpg" alt="Bhojpuri Song" onerror="this.remove(); this.parentElement.textContent='🎶';">
        </span>
        <span class="tab-label">Bhojpuri Song</span>
      </button>
    </div>
  </main>

  <div class="list-wrap">
    <div class="playlist-drawer" id="drawer">
      <div id="listItems"></div>
    </div>
  </div>

  <div class="player-dock">
    <div class="player-card">
      <div class="now-playing-row">
        <div class="cover-wrap"><img id="cover" class="cover-img" src="" alt="Cover art"></div>
        <div class="track-details">
          <div class="marquee" id="titleMarquee"><h4 class="marquee-inner" id="title">Loading…</h4></div>
          <p id="artist">Pick a track to start</p>
        </div>
      </div>

      <div class="seek-row">
        <span class="seek-time" id="tCur">0:00</span>
        <div class="seek-track" id="seek"><div class="seek-fill" id="seekFill"></div></div>
        <span class="seek-time dur" id="tDur">0:00</span>
      </div>

      <div class="controls-group">
        <button class="ctrl-btn" id="shuffle" title="Shuffle">🔀</button>
        <button class="ctrl-btn" id="prev" title="Previous">⏮</button>
        <button class="play-btn" id="play" disabled>▶</button>
        <button class="ctrl-btn" id="next" title="Next">⏭</button>
        <button class="ctrl-btn queue-btn" id="listBtn" title="Browse &amp; change songs">☰<span class="list-count" id="listCount"></span></button>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://new-profotilo-flame.vercel.app/" target="_blank"><span>Made by Harsh</span></a>
  </footer>

  <div id="yt-player-holder"><div id="yt-player"></div></div>

<script>
let PLAYLISTS = [];
let SINGLES = [];
let BHAKTI = [];
let BHOJPURI = [];
let BACKGROUNDS = [];

/* ── Default photo backdrop (used for Playlists / Single Songs) ── */
const DEFAULT_BG = "url('https://i.ibb.co/nMVLVCVy/image4.jpg')";

/* ── Dedicated backdrops for Bhakti / Bhojpuri ───────────────────
   These are plain gradients for now so each tab visibly gets its
   own distinct backdrop out of the box. Swap either value for a
   real `url('...')` image link any time — no other code changes
   needed. */
const BHAKTI_BG   = 'linear-gradient(160deg,#2a1806 0%,#6b3d0f 45%,#c9820f 100%)';
const BHOJPURI_BG = 'linear-gradient(160deg,#1a2a12 0%,#2f5c1f 45%,#7fae2c 100%)';

/* ── Category → track-list + title + backdrop map ────────────── */
const TAB_META = {
  playlists: { getList: () => PLAYLISTS, title: 'पुरानी यादें', bg: DEFAULT_BG,  hue: 'none' },
  singles:   { getList: () => SINGLES,   title: 'पुरानी यादें', bg: DEFAULT_BG,  hue: 'none' },
  bhakti:    { getList: () => BHAKTI,    title: 'भक्ति गीत',    bg: BHAKTI_BG,   hue: 'saturate(1.15) brightness(1.03)' },
  bhojpuri:  { getList: () => BHOJPURI,  title: 'भोजपुरी गीत',  bg: BHOJPURI_BG, hue: 'saturate(1.1)' },
};

/* ── Fetch track.json data dynamically ────────────────────── */
async function loadTrackData() {
  try {
    const res = await fetch('track.json');
    const data = await res.json();
    PLAYLISTS = data.PLAYLISTS || [];
    SINGLES = data.SINGLES || [];
    BHAKTI = data.BHAKTI || [];
    BHOJPURI = data.BHOJPURI || [];
    BACKGROUNDS = data.BACKGROUNDS || [];

    [...PLAYLISTS, ...SINGLES, ...BHAKTI, ...BHOJPURI].forEach(t => t.cover = `https://img.youtube.com/vi/${t.id}/hqdefault.jpg`);

    state.list = TAB_META[state.tab].getList();
    state.order = buildOrder();
    renderList();
  } catch (err) {
    console.error('Failed to load track.json', err);
  }
}

/* ── Shorthand + state ────────────────────────────────────── */
const $ = id => document.getElementById(id);
const el = {
  listItems: $('listItems'), drawer: $('drawer'), listBtn: $('listBtn'), listCount: $('listCount'),
  heroTitle: $('heroTitle'),
  cover: $('cover'), title: $('title'), artist: $('artist'),
  trackDetails: document.querySelector('.track-details'), titleMarquee: $('titleMarquee'),
  play: $('play'), prev: $('prev'), next: $('next'), shuffleBtn: $('shuffle'),
  seek: $('seek'), seekFill: $('seekFill'), tCur: $('tCur'), tDur: $('tDur'),
  bgA: $('bgA'), bgB: $('bgB'), clock: $('clock'), liveCount: $('liveCount'),
  nightBtn: $('nightBtn'), repeatBtn: $('repeatBtn'), ytBtn: $('ytBtn'),
};

const state = {
  tab: 'playlists', list: [], order: [], pos: 0,
  ready: false, playing: false, scrubbing: false, bgIndex: 0, shuffleOn: false, repeatOn: false,
};
let yt = null;
let bgToggle = false;

const fmt = s => {
  if (!Number.isFinite(s) || s < 0) s = 0;
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
};

function shuffleArr(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildOrder(){ return Array.from({length: state.list.length}, (_, i) => i); }
const currentTrack = () => state.list[state.order[state.pos]];

/* ── Ambient backdrop linked to active tab + song index ────── */
function applyBackground(){
  const meta = TAB_META[state.tab];
  const showEl = bgToggle ? el.bgB : el.bgA;
  const hideEl = bgToggle ? el.bgA : el.bgB;

  let bgImage, tint;
  if ((state.tab === 'playlists' || state.tab === 'singles') && BACKGROUNDS.length) {
    // Playlists / Single Songs: rotate the ambient photo per current song.
    const bg = BACKGROUNDS[state.pos % BACKGROUNDS.length];
    bgImage = `url('${bg.url}')`;
    tint = bg.tint === 'none' ? '' : bg.tint;
  } else {
    // Bhakti / Bhojpuri (or no per-song backgrounds yet): each tab gets its own backdrop.
    bgImage = meta.bg;
    tint = '';
  }

  showEl.style.backgroundImage = bgImage;
  showEl.style.filter = `${tint} ${meta.hue === 'none' ? '' : meta.hue}`.trim();
  showEl.classList.add('is-active');
  hideEl.classList.remove('is-active');
  bgToggle = !bgToggle;
}

/* ── Marquee (only animates if text overflows) ───────────── */
function refreshMarquee(){
  el.titleMarquee.classList.remove('is-scrolling');
  requestAnimationFrame(() => {
    if (el.titleMarquee.scrollWidth > el.titleMarquee.clientWidth + 4){
      el.titleMarquee.classList.add('is-scrolling');
    }
  });
}

/* ── Rendering ────────────────────────────────────────────── */
function renderTrack({ animate = true } = {}) {
  const t = currentTrack();
  if (!t) { el.title.textContent = 'No track selected'; el.artist.textContent = ''; return; }

  const paint = () => {
    el.title.textContent = t.title;
    el.artist.textContent = t.artist;
    el.cover.src = t.cover;
    el.cover.alt = t.title;
    el.trackDetails.classList.remove('is-fading');
    el.cover.classList.remove('is-fading');
    refreshMarquee();
  };

  if (animate) {
    el.trackDetails.classList.add('is-fading');
    el.cover.classList.add('is-fading');
    setTimeout(paint, 180);
  } else paint();

  applyBackground();

  [...el.listItems.children].forEach((row, i) => row.classList.toggle('is-current', i === state.pos));
}

function renderList() {
  el.listItems.innerHTML = '';
  if (!state.list.length) {
    const empty = document.createElement('div');
    empty.className = 'track-row';
    empty.style.justifyContent = 'center';
    empty.innerHTML = `<span class="t-title" style="text-align:center; flex:none;">जल्द आ रहा है ✨</span>`;
    el.listItems.append(empty);
    el.listCount.textContent = 0;
    applyBackground();
    return;
  }
  state.list.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-row';
    row.innerHTML = `<span class="t-title">${t.title}</span><span class="t-artist">${t.artist}</span>`;
    row.addEventListener('click', () => playAt(state.order.indexOf(i)));
    el.listItems.append(row);
  });
  el.listCount.textContent = state.list.length;
  renderTrack({ animate: false });
}

function renderPlaying(on) {
  state.playing = on;
  el.play.textContent = on ? '⏸' : '▶';
}

/* ── Tabs (bouncy switch + dynamic list + backdrop tint) ────── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('active')) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    btn.classList.remove('is-bouncing');
    void btn.offsetWidth; // restart animation
    btn.classList.add('is-bouncing');
    btn.addEventListener('animationend', () => btn.classList.remove('is-bouncing'), { once: true });

    state.tab = btn.dataset.tab;
    state.list = TAB_META[state.tab].getList();
    state.order = buildOrder();
    state.pos = 0;
    renderList();
    updateHeroTitle();
  });
});

function updateHeroTitle(){
  const nextTitle = TAB_META[state.tab].title;
  if (el.heroTitle.textContent === nextTitle) return;
  el.heroTitle.classList.add('is-fading');
  setTimeout(() => {
    el.heroTitle.textContent = nextTitle;
    el.heroTitle.classList.remove('is-fading');
  }, 220);
}

/* ── Drawer toggle ────────────────────────────────────────── */
el.listBtn.addEventListener('click', () => {
  const open = !el.drawer.classList.contains('is-open');
  el.drawer.classList.toggle('is-open', open);
  el.listBtn.classList.toggle('is-on', open);
  if (open) el.listItems.children[state.pos]?.scrollIntoView({ block: 'center', behavior: 'smooth' });
});

/* ── Playback ─────────────────────────────────────────────── */
function playAt(orderPos) {
  const n = state.order.length;
  state.pos = ((orderPos % n) + n) % n;
  renderTrack();
  if (!yt || !state.ready) return;
  yt.loadVideoById(currentTrack().id);
  yt.playVideo();
}
function toggle() {
  if (!yt || !state.ready) return;
  state.playing ? yt.pauseVideo() : yt.playVideo();
}
function go(delta) { if (state.order.length) playAt(state.pos + delta); }

el.play.addEventListener('click', toggle);
el.prev.addEventListener('click', () => {
  if (yt && (yt.getCurrentTime() || 0) > 3) yt.seekTo(0, true);
  else go(-1);
});
el.next.addEventListener('click', () => go(1));

el.shuffleBtn.addEventListener('click', () => {
  const keepTrackIdx = state.order[state.pos];
  state.shuffleOn = !state.shuffleOn;
  el.shuffleBtn.classList.toggle('is-on', state.shuffleOn);
  state.order = state.shuffleOn ? shuffleArr(buildOrder()) : buildOrder();
  state.pos = Math.max(0, state.order.indexOf(keepTrackIdx));
  renderTrack({ animate: false });
});

el.repeatBtn.addEventListener('click', () => {
  state.repeatOn = !state.repeatOn;
  el.repeatBtn.classList.toggle('is-on', state.repeatOn);
});

/* ── Fully Working Dark Mode Toggle ──────────────────────── */
el.nightBtn.addEventListener('click', () => {
  const isDark = document.body.classList.toggle('dark-mode');
  el.nightBtn.classList.toggle('is-on', isDark);
  el.nightBtn.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
});

// Load saved dark mode preference
if (localStorage.getItem('darkMode') === 'enabled') {
  document.body.classList.add('dark-mode');
  el.nightBtn.classList.add('is-on');
  el.nightBtn.textContent = '☀️';
}

el.ytBtn.addEventListener('click', () => {
  const t = currentTrack();
  if (t) window.open(`https://www.youtube.com/watch?v=${t.id}`, '_blank');
});

/* ── Seek bar ─────────────────────────────────────────────── */
function fractionFromEvent(e) {
  const r = el.seek.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  return Math.min(1, Math.max(0, x / r.width));
}
el.seek.addEventListener('pointerdown', e => {
  if (!yt) return;
  state.scrubbing = true;
  el.seek.setPointerCapture(e.pointerId);
  el.seekFill.style.width = `${fractionFromEvent(e) * 100}%`;
});
el.seek.addEventListener('pointermove', e => { if (state.scrubbing) el.seekFill.style.width = `${fractionFromEvent(e) * 100}%`; });
el.seek.addEventListener('pointerup', e => {
  if (!state.scrubbing) return;
  state.scrubbing = false;
  const dur = yt?.getDuration?.() || 0;
  if (dur) yt.seekTo(dur * fractionFromEvent(e), true);
});

/* ── Progress polling ─────────────────────────────────────── */
setInterval(() => {
  if (!yt || state.scrubbing || typeof yt.getCurrentTime !== 'function') return;
  const cur = yt.getCurrentTime() || 0;
  const dur = yt.getDuration() || 0;
  if (dur) { el.seekFill.style.width = `${Math.min(100, (cur / dur) * 100)}%`; el.tDur.textContent = fmt(dur); }
  el.tCur.textContent = fmt(cur);
}, 500);

/* ── Clock ────────────────────────────────────────────────── */
function tickClock(){
  el.clock.textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
}
tickClock();
setInterval(tickClock, 15000);

/* ── Live listener count ─────────────────────────────────── */
(function driftListeners(){
  const MIN = 27, MAX = 35;
  let count = MIN + Math.floor(Math.random() * (MAX - MIN));
  el.liveCount.textContent = count;
  const step = () => {
    const mid = (MIN + MAX) / 2;
    const up = Math.random() < (count < mid ? 0.6 : 0.4);
    count = Math.max(MIN, Math.min(MAX, count + (up ? 1 : -1)));
    el.liveCount.textContent = count;
    setTimeout(step, 3000 + Math.random() * 4000);
  };
  setTimeout(step, 2500);
})();

/* ── YouTube IFrame API boot ──────────────────────────────── */
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('yt-player', {
    height: '1', width: '1',
    videoId: 'NlWmLCZM7gA',
    playerVars: { playsinline: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0 },
    events: {
      onReady: () => { state.ready = true; el.play.disabled = false; },
      onStateChange: e => {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) renderPlaying(true);
        else if (e.data === S.PAUSED) renderPlaying(false);
        else if (e.data === S.ENDED) state.repeatOn ? playAt(state.pos) : go(1);
      },
      onError: () => go(1),
    },
  });
};

/* ── Init ─────────────────────────────────────────────────── */
loadTrackData();
window.addEventListener('resize', refreshMarquee);
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>

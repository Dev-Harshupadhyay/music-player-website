<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Wala Music</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .nav-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .nav-btn { padding: 10px 25px; border-radius: 20px; border: none; cursor: pointer; background: #333; color: white; font-weight: bold; }
        .nav-btn.active { background: #ff9800; }
        .player-card { background: #181818; padding: 20px; border-radius: 20px; width: 350px; text-align: center; }
        .thumb { width: 100%; height: 200px; border-radius: 10px; object-fit: cover; }
        #yt-player { display: none; }
        .controls { margin-top: 15px; }
    </style>
</head>
<body>

    <div class="nav-container">
        <button class="nav-btn active" id="btn-playlist" onclick="showType('playlist')">Playlists</button>
        <button class="nav-btn" id="btn-single" onclick="showType('single')">Single Songs</button>
    </div>

    <div class="player-card">
        <img id="thumb" class="thumb" src="" alt="Thumbnail">
        <h3 id="title">Select a track</h3>
        <div class="controls">
            <button onclick="togglePlay()">Play/Pause</button>
        </div>
    </div>

    <div id="yt-player"></div>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // Data containing all your links
        const tracks = {
            playlist: [
                { id: 'sCIiVN0zIGE', title: 'Evergreen Hindi Songs' },
                { id: 'NlWmLCZM7gA', title: '90s Hits Bollywood' },
                { id: '7obFFUPv4Hs', title: 'Kumar Sanu Hits' },
                { id: 'ebw1zHtleFY', title: 'Kishore Kumar Hits' },
                { id: 'SI3cjQISDqs', title: '90s Superhit Songs' }
            ],
            single: [
                { id: 'HpLIPK48a-c', title: 'Saagar Jaisi - Kishore Kumar' },
                { id: 'R2m3FN_UEUk', title: 'Abhijeet Hits' },
                { id: '9b0iydtDZLU', title: 'Kumar Sanu Romantic' },
                { id: '78CN-Fx7oNo', title: 'Udit Narayan Hits' },
                { id: 'GXYucMSjkzU', title: 'Alka Yagnik Hits' }
            ]
        };

        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', { height: '1', width: '1', videoId: tracks.playlist[0].id });
        }

        function showType(type) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
            // Logic to display lists goes here (you can create a simple list display)
            alert('Loading ' + type + ' mode...');
        }

        function togglePlay() {
            if (player.getPlayerState() === 1) player.pauseVideo();
            else player.playVideo();
        }
    </script>
</body>
</html>

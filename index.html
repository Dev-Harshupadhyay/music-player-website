<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purani Yaadein — Music Player</title>
<style>
  :root{
    --accent:#ff9800;
    --accent-2:#ffb74d;
    --glass:rgba(24,24,24,0.72);
    --glass-strong:rgba(18,18,18,0.88);
    --border:rgba(255,255,255,0.10);
    --text-dim:#b3b3b3;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  html,body{height:100%;}
  body{
    background:#0c0c0e;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* Ambient blurred backdrop, driven by the current cover art */
  .bg-layer{
    position:fixed; inset:0;
    background-size:cover;
    background-position:center;
    filter:blur(38px) saturate(120%) brightness(0.45);
    transform:scale(1.15);
    transition:opacity 1.1s ease;
    opacity:0;
    z-index:0;
  }
  .bg-layer.is-active{opacity:1;}
  body::after{
    content:'';
    position:fixed; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.75) 60%, rgba(0,0,0,0.92));
    z-index:0;
  }

  header, main, .player-dock, footer{position:relative; z-index:5; width:100%; display:flex; justify-content:center;}

  /* ── Top nav ─────────────────────────────── */
  header{padding:22px 16px 8px;}
  .tabs{
    display:flex; gap:10px;
    background:var(--glass);
    padding:6px; border-radius:30px;
    backdrop-filter:blur(14px);
    border:1px solid var(--border);
  }
  .tab-btn{
    padding:10px 26px; font-size:14px; font-weight:700;
    border:none; border-radius:24px; cursor:pointer;
    background:transparent; color:var(--text-dim);
    transition:all .25s ease; letter-spacing:.3px;
  }
  .tab-btn.active{
    background:var(--accent); color:#111;
    box-shadow:0 6px 18px rgba(255,152,0,.4);
  }

  /* ── Hero ────────────────────────────────── */
  .hero{flex-direction:column; align-items:center; text-align:center; padding:28px 20px 10px;}
  .hero h1{
    font-size:clamp(30px,7vw,52px); font-weight:900;
    text-shadow:0 4px 22px rgba(0,0,0,.85);
    letter-spacing:.5px;
  }
  .hero p{margin-top:8px; color:var(--text-dim); font-size:14px; letter-spacing:.4px;}

  /* ── Track list ──────────────────────────── */
  .list-wrap{width:100%; max-width:560px; padding:14px 16px 0; flex-direction:column;}
  .playlist-drawer{
    background:var(--glass); backdrop-filter:blur(16px);
    border:1px solid var(--border); border-radius:22px;
    width:100%; max-height:0; overflow:hidden;
    transition:max-height .45s ease, padding .45s ease, opacity .3s ease;
    opacity:0; padding:0 6px;
  }
  .playlist-drawer.is-open{max-height:420px; overflow-y:auto; padding:10px; opacity:1;}
  .track-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 10px; border-radius:14px; cursor:pointer;
    transition:background .2s ease;
  }
  .track-row:hover{background:rgba(255,255,255,.06);}
  .track-row.is-current{background:rgba(255,152,0,.22);}
  .track-row img{width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0;}
  .track-meta{display:flex; flex-direction:column; overflow:hidden; text-align:left; flex-grow:1;}
  .track-meta .t-title{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .track-meta .t-artist{font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .now-badge{font-size:11px; color:var(--accent); font-weight:700; flex-shrink:0;}
  .empty-note{padding:24px 10px; text-align:center; color:var(--text-dim); font-size:13px;}

  /* ── Player dock ─────────────────────────── */
  .player-dock{padding:18px 16px 10px;}
  .player-card{
    background:var(--glass-strong); backdrop-filter:blur(18px);
    border:1px solid var(--border); border-radius:30px;
    width:100%; max-width:560px;
    padding:14px 18px 16px;
    box-shadow:0 16px 40px rgba(0,0,0,.6);
    display:flex; flex-direction:column; gap:10px;
  }
  .now-playing-row{display:flex; align-items:center; gap:14px;}
  .cover-img{width:56px; height:56px; border-radius:14px; object-fit:cover; background:#222; flex-shrink:0;}
  .track-details{flex-grow:1; overflow:hidden; text-align:left;}
  .track-details h4{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .track-details p{font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}

  .seek-row{display:flex; align-items:center; gap:8px;}
  .seek-time{font-size:11px; color:var(--text-dim); min-width:34px;}
  .seek-time.dur{text-align:right;}
  .seek-track{
    flex-grow:1; height:5px; border-radius:4px; background:rgba(255,255,255,.15);
    position:relative; cursor:pointer;
  }
  .seek-fill{position:absolute; inset:0; width:0%; background:var(--accent); border-radius:4px; transition:width .15s linear;}

  .controls-group{display:flex; align-items:center; justify-content:center; gap:18px;}
  .ctrl-btn{
    background:none; border:none; color:#fff; font-size:20px; cursor:pointer;
    padding:6px; opacity:.85; transition:opacity .2s, transform .2s;
  }
  .ctrl-btn:hover{opacity:1; transform:scale(1.08);}
  .ctrl-btn.is-on{color:var(--accent); opacity:1;}
  .play-btn{
    background:#fff; color:#000; width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; border:none; cursor:pointer; flex-shrink:0;
    transition:transform .15s ease;
  }
  .play-btn:hover{transform:scale(1.06);}
  .play-btn:disabled{opacity:.5; cursor:wait;}

  footer{padding:14px; margin-bottom:6px;}
  footer span{
    font-size:12px; color:var(--text-dim); background:rgba(0,0,0,.55);
    padding:6px 18px; border-radius:20px; letter-spacing:1px; backdrop-filter:blur(6px);
  }

  #yt-player-holder{position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;}

  @media (max-width:480px){
    .tab-btn{padding:9px 18px; font-size:13px;}
    .cover-img{width:48px; height:48px;}
  }
</style>
</head>
<body>

  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>

  <header>
    <div class="tabs">
      <button class="tab-btn active" data-tab="playlists">Playlists</button>
      <button class="tab-btn" data-tab="singles">Single Songs</button>
    </div>
  </header>

  <main class="hero">
    <h1>पुरानी यादें</h1>
    <p>Bollywood classics, streamed straight from YouTube</p>
  </main>

  <div class="list-wrap">
    <div class="playlist-drawer" id="drawer">
      <div id="listItems"></div>
    </div>
  </div>

  <div class="player-dock">
    <div class="player-card">
      <div class="now-playing-row">
        <img id="cover" class="cover-img" src="" alt="Cover art">
        <div class="track-details">
          <h4 id="title">Loading…</h4>
          <p id="artist">Pick a track to start</p>
        </div>
        <button class="play-btn" id="play" disabled>▶</button>
      </div>

      <div class="seek-row">
        <span class="seek-time" id="tCur">0:00</span>
        <div class="seek-track" id="seek"><div class="seek-fill" id="seekFill"></div></div>
        <span class="seek-time dur" id="tDur">0:00</span>
      </div>

      <div class="controls-group">
        <button class="ctrl-btn" id="prev" title="Previous">⏮</button>
        <button class="ctrl-btn" id="listBtn" title="Toggle playlist">📂</button>
        <button class="ctrl-btn" id="next" title="Next">⏭</button>
      </div>
    </div>
  </div>

  <footer><span>Made by Harsh</span></footer>

  <div id="yt-player-holder"><div id="yt-player"></div></div>

<script>
/* ── Track data ─────────────────────────────────────────── */
const PLAYLISTS = [
  { id: "NlWmLCZM7gA", title: "90s Love & Hindi Songs", artist: "Various Artists" },
  { id: "7obFFUPv4Hs", title: "Kumar Sanu Hit Songs", artist: "Kumar Sanu" },
  { id: "ebw1zHtleFY", title: "Kishore Kumar Hits", artist: "Kishore Kumar" },
  { id: "SI3cjQISDqs", title: "90s Superhit Songs", artist: "Various Artists" },
];

const SINGLES = [
  { id: "HpLIPK48a-c", title: "Saagar Jaisi Aankhon Wali", artist: "Kishore Kumar" },
  { id: "R2m3FN_UEUk", title: "Ab Tere Dil Mein Hum Aa Gaye", artist: "Kumar Sanu & Alka Yagnik" },
  { id: "9b0iydtDZLU", title: "Waada Raha Sanam", artist: "Abhijeet & Alka Yagnik" },
  { id: "78CN-Fx7oNo", title: "Mauka Milega To Hum Bata Denge", artist: "Udit Narayan & Alka Yagnik" },
  { id: "GXYucMSjkzU", title: "Kahin Mujhe Pyar Hua Toh Nahi", artist: "Kumar Sanu & Alka Yagnik" },
];

[...PLAYLISTS, ...SINGLES].forEach(t => t.cover = `https://img.youtube.com/vi/${t.id}/hqdefault.jpg`);

/* ── Shorthand + state ──────────────────────────────────── */
const $ = id => document.getElementById(id);
const el = {
  listItems: $('listItems'), drawer: $('drawer'), listBtn: $('listBtn'),
  cover: $('cover'), title: $('title'), artist: $('artist'),
  play: $('play'), prev: $('prev'), next: $('next'),
  seek: $('seek'), seekFill: $('seekFill'), tCur: $('tCur'), tDur: $('tDur'),
  bgA: $('bgA'), bgB: $('bgB'),
};

const state = { tab: 'playlists', list: PLAYLISTS, pos: 0, ready: false, playing: false, scrubbing: false };
let yt = null;
let bgToggle = false;

const fmt = s => {
  if (!Number.isFinite(s) || s < 0) s = 0;
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
};

const currentTrack = () => state.list[state.pos];

/* ── Rendering ──────────────────────────────────────────── */
function renderTrack() {
  const t = currentTrack();
  if (!t) {
    el.title.textContent = 'No track selected';
    el.artist.textContent = 'Pick something from the list';
    return;
  }
  el.title.textContent = t.title;
  el.artist.textContent = t.artist;
  el.cover.src = t.cover;
  el.cover.alt = t.title;

  // crossfade the ambient backdrop
  const showEl = bgToggle ? el.bgB : el.bgA;
  const hideEl = bgToggle ? el.bgA : el.bgB;
  showEl.style.backgroundImage = `url('${t.cover}')`;
  showEl.classList.add('is-active');
  hideEl.classList.remove('is-active');
  bgToggle = !bgToggle;

  [...el.listItems.children].forEach((row, i) => row.classList.toggle('is-current', i === state.pos));
}

function renderList() {
  el.listItems.innerHTML = '';
  if (!state.list.length) {
    el.listItems.innerHTML = `<div class="empty-note">Nothing here yet</div>`;
    return;
  }
  state.list.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-row';
    row.innerHTML = `
      <img src="${t.cover}" alt="">
      <div class="track-meta">
        <span class="t-title">${t.title}</span>
        <span class="t-artist">${t.artist}</span>
      </div>
      <span class="now-badge"></span>`;
    row.addEventListener('click', () => playAt(i));
    el.listItems.append(row);
  });
  renderTrack();
}

function renderPlaying(on) {
  state.playing = on;
  el.play.textContent = on ? '⏸' : '▶';
}

/* ── Tabs ───────────────────────────────────────────────── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    state.list = state.tab === 'playlists' ? PLAYLISTS : SINGLES;
    state.pos = 0;
    renderList();
  });
});

/* ── Drawer toggle ──────────────────────────────────────── */
el.listBtn.addEventListener('click', () => {
  const open = !el.drawer.classList.contains('is-open');
  el.drawer.classList.toggle('is-open', open);
  el.listBtn.classList.toggle('is-on', open);
});

/* ── Playback ───────────────────────────────────────────── */
function playAt(i) {
  state.pos = i;
  renderTrack();
  if (!yt || !state.ready) return;
  yt.loadVideoById(currentTrack().id);
  yt.playVideo();
}

function toggle() {
  if (!yt || !state.ready) return;
  if (state.playing) yt.pauseVideo();
  else yt.playVideo();
}

function go(delta) {
  const n = state.list.length;
  if (!n) return;
  playAt(((state.pos + delta) % n + n) % n);
}

el.play.addEventListener('click', toggle);
el.prev.addEventListener('click', () => {
  if (yt && (yt.getCurrentTime() || 0) > 3) yt.seekTo(0, true);
  else go(-1);
});
el.next.addEventListener('click', () => go(1));

/* ── Seek bar ───────────────────────────────────────────── */
function fractionFromEvent(e) {
  const r = el.seek.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  return Math.min(1, Math.max(0, x / r.width));
}
el.seek.addEventListener('pointerdown', e => {
  if (!yt) return;
  state.scrubbing = true;
  el.seek.setPointerCapture(e.pointerId);
  el.seekFill.style.width = `${fractionFromEvent(e) * 100}%`;
});
el.seek.addEventListener('pointermove', e => {
  if (state.scrubbing) el.seekFill.style.width = `${fractionFromEvent(e) * 100}%`;
});
el.seek.addEventListener('pointerup', e => {
  if (!state.scrubbing) return;
  state.scrubbing = false;
  const dur = yt?.getDuration?.() || 0;
  if (dur) yt.seekTo(dur * fractionFromEvent(e), true);
});

/* ── Progress polling ───────────────────────────────────── */
setInterval(() => {
  if (!yt || state.scrubbing || typeof yt.getCurrentTime !== 'function') return;
  const cur = yt.getCurrentTime() || 0;
  const dur = yt.getDuration() || 0;
  if (dur) {
    el.seekFill.style.width = `${Math.min(100, (cur / dur) * 100)}%`;
    el.tDur.textContent = fmt(dur);
  }
  el.tCur.textContent = fmt(cur);
}, 500);

/* ── YouTube IFrame API boot ────────────────────────────── */
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('yt-player', {
    height: '1', width: '1',
    videoId: currentTrack().id,
    playerVars: { playsinline: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0 },
    events: {
      onReady: () => { state.ready = true; el.play.disabled = false; },
      onStateChange: e => {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) renderPlaying(true);
        else if (e.data === S.PAUSED) renderPlaying(false);
        else if (e.data === S.ENDED) go(1);
      },
      onError: () => go(1), // skip dead / region-blocked videos
    },
  });
};

/* ── Init ───────────────────────────────────────────────── */
renderList();
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पुरानी यादें — Music Player</title>
<style>
  :root{
    --accent:#ff9800;
    --glass:rgba(24,24,24,0.68);
    --glass-strong:rgba(16,14,13,0.82);
    --border:rgba(255,255,255,0.12);
    --text-dim:#cfc9c3;
    --bg-base:#151008;
    --text-color:#fff;
    --footer-bg:rgba(0,0,0,.5);
  }

  body.dark-mode {
    --accent:#00e5ff;
    --glass:rgba(15,23,42,0.75);
    --glass-strong:rgba(10,15,30,0.88);
    --border:rgba(255,255,255,0.08);
    --text-dim:#94a3b8;
    --bg-base:#090d16;
    --text-color:#f8fafc;
    --footer-bg:rgba(10,15,30,0.6);
  }

  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  html,body{height:100%;}
  body{
    color:var(--text-color);
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow-x:hidden; position:relative;
    background:var(--bg-base);
    transition: background 0.3s ease, color 0.3s ease;
  }

  .bg-layer{
    position:fixed; inset:0;
    background-size:cover; background-position:center;
    transition:opacity 1.2s ease, filter 1.2s ease;
    opacity:0; z-index:0;
  }
  .bg-layer.is-active{opacity:1;}
  body::after{
    content:''; position:fixed; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(10,7,5,.45), rgba(10,7,5,.72) 55%, rgba(6,4,3,.92));
    transition: background 0.3s ease;
  }
  body.dark-mode::after{
    background:linear-gradient(180deg, rgba(5,7,15,.55), rgba(5,7,15,.82) 55%, rgba(2,4,8,.95));
  }

  header, .status-row, main, .list-wrap, .player-dock, footer{position:relative; z-index:5; width:100%; display:flex; justify-content:center;}

  .status-row{padding:18px 20px 0; justify-content:space-between; max-width:560px; margin:0 auto;}
  .status-left{display:flex; align-items:center; gap:10px;}
  .clock{font-size:26px; font-weight:800; letter-spacing:.5px;}
  .icon-pill{
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; cursor:pointer; transition:background .2s;
  }
  .icon-pill:hover{background:rgba(255,255,255,.16);}
  .icon-pill.is-on{background:var(--accent); color:#111;}
  .status-right{display:flex; align-items:center; gap:10px;}

  .live-row{padding:10px 20px 0; justify-content:center;}
  .live-pill{
    display:flex; align-items:center; gap:8px;
    font-size:14px; color:var(--text-dim); font-weight:600;
  }
  .live-dot{width:9px; height:9px; border-radius:50%; background:#3ddc73; box-shadow:0 0 8px #3ddc73; flex-shrink:0;}

  .hero{flex-direction:column; align-items:center; text-align:center; padding:18px 20px 6px;}
  .hero h1{
    font-size:clamp(34px,9vw,58px); font-weight:900;
    text-shadow:0 6px 24px rgba(0,0,0,.9);
    letter-spacing:.5px; line-height:1.1;
  }

  .tabs{display:flex; gap:8px; margin-top:16px; background:var(--glass); padding:6px; border-radius:30px; backdrop-filter:blur(14px); border:1px solid var(--border); transition:background 0.3s ease;}
  .tab-btn{padding:9px 22px; font-size:13px; font-weight:700; border:none; border-radius:22px; cursor:pointer; background:transparent; color:var(--text-dim); transition:all .25s ease;}
  .tab-btn.active{background:var(--accent); color:#111; box-shadow:0 6px 16px rgba(255,152,0,.4);}

  .list-wrap{max-width:560px; padding:16px 16px 0; flex-direction:column;}
  .playlist-drawer{
    background:var(--glass); backdrop-filter:blur(18px);
    border:1px solid var(--border); border-radius:24px;
    width:100%; max-height:0; overflow:hidden;
    transition:max-height .45s ease, padding .45s ease, opacity .3s ease, background 0.3s ease;
    opacity:0; padding:0 6px;
  }
  .playlist-drawer.is-open{max-height:380px; overflow-y:auto; padding:8px; opacity:1;}
  .track-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; border-radius:16px; cursor:pointer;
    transition:background .2s ease;
  }
  .track-row:hover{background:rgba(255,255,255,.06);}
  .track-row.is-current{background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 1px var(--accent);}
  .t-title{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto;}
  .t-artist{font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 0 auto; max-width:42%; text-align:right;}
  .track-row.is-current .t-title, .track-row.is-current .t-artist{color:var(--text-color);}

  /* ── Raju Mistri Style Original Vinyl Player Layout ──────── */
  .player-dock{padding:16px 16px 10px; margin-top:14px;}
  .player{
    background:var(--glass-strong); backdrop-filter:blur(20px);
    border:1px solid var(--border); border-radius:32px;
    width:100%; max-width:560px; padding:18px 20px;
    box-shadow:0 18px 44px rgba(0,0,0,.65);
    display:flex; align-items:center; gap:16px;
    transition: background 0.3s ease;
  }

  /* Rotating Vinyl Design */
  .vinyl{
    width:58px; height:58px; border-radius:50%; flex-shrink:0; position:relative;
    background:#111; border:2px solid rgba(255,255,255,.2); box-shadow:0 6px 16px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .vinyl-spin{width:100%; height:100%; position:relative; border-radius:50%; overflow:hidden;}
  .vinyl-spin img{width:100%; height:100%; object-fit:cover; display:block;}
  
  @keyframes vinylRotation {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .vinyl.is-spinning .vinyl-spin {
    animation: vinylRotation 4s linear infinite;
  }
  
  .vinyl-hole{
    position:absolute; width:14px; height:14px; background:var(--bg-base);
    border:2px solid rgba(255,255,255,0.4); border-radius:50%;
    top:50%; left:50%; transform:translate(-50%, -50%); z-index:2;
  }

  .track-meta{flex:1 1 auto; overflow:hidden; display:flex; flex-direction:column; gap:8px;}
  .meta-row{display:flex; flex-direction:column; gap:2px;}
  .track-title{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .track-artist{font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* Seek Bar / Progress */
  .progress{display:flex; flex-direction:column;}
  .bar-row{display:flex; align-items:center; gap:8px;}
  .time{font-size:11px; color:var(--text-dim); min-width:28px;}
  .bar{
    flex-grow:1; height:6px; border-radius:4px; background:rgba(255,255,255,.18);
    position:relative; cursor:pointer; display:flex; align-items:center;
  }
  .bar-track{position:absolute; inset:0; border-radius:4px; overflow:hidden;}
  .bar-fill{position:absolute; inset:0; width:0%; background:var(--accent); border-radius:4px;}
  .bar-knob{
    position:absolute; width:10px; height:10px; background:#fff; border-radius:50%;
    top:50%; transform:translate(-50%, -50%); box-shadow:0 2px 6px rgba(0,0,0,.5);
    pointer-events:none;
  }

  /* Controls Section */
  .ctrl{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:4px;}
  .ctrl button{background:none; border:none; color:var(--text-color); cursor:pointer; padding:6px; opacity:.85; transition:all .2s;}
  .ctrl button:hover{opacity:1; transform:scale(1.08);}
  .ctrl button.is-on{color:var(--accent); opacity:1;}
  
  #play{
    background:var(--text-color); color:var(--bg-base); width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; flex-shrink:0;
    box-shadow:0 6px 16px rgba(0,0,0,.3); transition:transform .15s ease;
  }
  #play:hover{transform:scale(1.06);}
  #play:active{transform:scale(0.92);}
  #play:disabled{opacity:.5; cursor:wait;}

  footer{padding:8px; margin-bottom:14px;}
  footer a{text-decoration:none;}
  footer span{font-size:12px; color:var(--text-dim); background:var(--footer-bg); padding:6px 18px; border-radius:20px; letter-spacing:1px; backdrop-filter:blur(6px); display:inline-block; transition:color 0.2s;}
  footer a:hover span{color:var(--text-color); background:rgba(255,255,255,0.15);}

  #yt-player-holder{position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;}

  @media (max-width:420px){
    .clock{font-size:22px;}
    .hero h1{font-size:clamp(28px,10vw,44px);}
    .player{padding:14px;}
  }
</style>
</head>
<body>

  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>

  <div class="status-row">
    <div class="status-left">
      <span class="clock" id="clock">--:--</span>
      <button class="icon-pill" id="nightBtn" title="Night mode">🌙</button>
    </div>
    <div class="status-right">
      <button class="icon-pill" id="repeatBtn" title="Repeat">🔁</button>
      <button class="icon-pill" id="ytBtn" title="Open on YouTube">▶</button>
    </div>
  </div>

  <div class="live-row">
    <div class="live-pill"><span class="live-dot"></span><span id="liveCount">27</span>&nbsp;सुन रहे हैं</div>
  </div>

  <main class="hero">
    <h1>पुरानी यादें</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="playlists">Playlists</button>
      <button class="tab-btn" data-tab="singles">Single Songs</button>
    </div>
  </main>

  <div class="list-wrap">
    <div class="playlist-drawer" id="drawer">
      <div id="listItems"></div>
    </div>
  </div>

  <!-- Raju Mistri Original Player Structure -->
  <div class="player-dock">
    <div class="player">
      <div class="vinyl" id="vinylWrap">
        <div class="vinyl-spin">
          <img id="cover" alt="album artwork" src=""/>
        </div>
        <div class="vinyl-hole"></div>
      </div>

      <div class="track-meta">
        <div class="meta-row">
          <p class="track-title" id="title">-</p>
          <p class="track-artist" id="artist">Loading playlist...</p>
        </div>
        <div class="progress">
          <div class="bar-row">
            <span class="time" id="cur">0:00</span>
            <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="bar-track">
                <div class="bar-fill" id="fill" style="width:0%"></div>
              </div>
              <div class="bar-knob" id="knob" style="left:0%"></div>
            </div>
            <span class="time" id="dur">0:00</span>
          </div>
        </div>
      </div>

      <div class="ctrl">
        <button type="button" id="shuffle" class="btn--toggle" aria-label="Shuffle" title="Shuffle">🔀</button>
        <button type="button" id="prev" aria-label="Previous track">⏮</button>
        <button type="button" id="play" aria-label="Play" disabled>
          <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button type="button" id="next" aria-label="Next track">⏭</button>
        <button type="button" id="listBtn" class="btn--toggle" aria-label="Playlist" title="Playlist">☰</button>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://new-profotilo-flame.vercel.app/" target="_blank"><span>Made by Harsh</span></a>
  </footer>

  <div id="yt-player-holder"><div id="yt-player"></div></div>

<script>
let PLAYLISTS = [];
let SINGLES = [];
let BACKGROUNDS = [];

async function loadTrackData() {
  try {
    const res = await fetch('track.json');
    const data = await res.json();
    PLAYLISTS = data.PLAYLISTS;
    SINGLES = data.SINGLES;
    BACKGROUNDS = data.BACKGROUNDS;

    [...PLAYLISTS, ...SINGLES].forEach(t => {
      t.cover = `https://img.youtube.com/vi/${t.id}/hqdefault.jpg`;
      if(t.start === undefined) t.start = 0;
    });
    
    state.list = PLAYLISTS;
    state.order = buildOrder();
    renderList();
  } catch (err) {
    console.error('Failed to load track.json', err);
  }
}

const $ = id => document.getElementById(id);
const el = {
  listItems: $('listItems'), drawer: $('drawer'), listBtn: $('listBtn'),
  cover: $('cover'), vinylWrap: $('vinylWrap'), title: $('title'), artist: $('artist'),
  play: $('play'), prev: $('prev'), next: $('next'), shuffleBtn: $('shuffle'),
  bar: $('bar'), fill: $('fill'), knob: $('knob'), cur: $('cur'), dur: $('dur'),
  bgA: $('bgA'), bgB: $('bgB'), clock: $('clock'), liveCount: $('liveCount'),
  nightBtn: $('nightBtn'), repeatBtn: $('repeatBtn'), ytBtn: $('ytBtn'),
};

const state = {
  tab: 'playlists', list: [], order: [], pos: 0,
  ready: false, playing: false, scrubbing: false, shuffleOn: false, repeatOn: false,
};
let yt = null;
let bgToggle = false;

const fmt = s => {
  if (!Number.isFinite(s) || s < 0) s = 0;
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
};

function shuffleArr(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildOrder(){ return Array.from({length: state.list.length}, (_, i) => i); }
const currentTrack = () => state.list[state.order[state.pos]];

function applyBackground(){
  if (!BACKGROUNDS.length) return;
  const bg = BACKGROUNDS[state.pos % BACKGROUNDS.length];
  const showEl = bgToggle ? el.bgB : el.bgA;
  const hideEl = bgToggle ? el.bgA : el.bgB;
  showEl.style.backgroundImage = `url('${bg.url}')`;
  showEl.style.filter = bg.tint;
  showEl.classList.add('is-active');
  hideEl.classList.remove('is-active');
  bgToggle = !bgToggle;
}

function renderTrack() {
  const t = currentTrack();
  if (!t) { el.title.textContent = 'No track selected'; el.artist.textContent = ''; return; }

  el.title.textContent = t.title;
  el.artist.textContent = t.artist;
  el.cover.src = t.cover;
  el.cover.alt = t.title;

  applyBackground();
  [...el.listItems.children].forEach((row, i) => row.classList.toggle('is-current', i === state.pos));
}

function renderList() {
  el.listItems.innerHTML = '';
  state.list.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-row';
    row.innerHTML = `<span class="t-title">${t.title}</span><span class="t-artist">${t.artist}</span>`;
    row.addEventListener('click', () => playAt(state.order.indexOf(i)));
    el.listItems.append(row);
  });
  renderTrack();
}

function renderPlaying(on) {
  state.playing = on;
  el.play.innerHTML = on ? 
    `<svg class="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>` : 
    `<svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`;
  
  if (on) {
    el.vinylWrap.classList.add('is-spinning');
  } else {
    el.vinylWrap.classList.remove('is-spinning');
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    state.list = state.tab === 'playlists' ? PLAYLISTS : SINGLES;
    state.order = buildOrder();
    state.pos = 0;
    renderList();
  });
});

el.listBtn.addEventListener('click', () => {
  const open = !el.drawer.classList.contains('is-open');
  el.drawer.classList.toggle('is-open', open);
  el.listBtn.classList.toggle('is-on', open);
  if (open) el.listItems.children[state.pos]?.scrollIntoView({ block: 'center', behavior: 'smooth' });
});

function playAt(orderPos) {
  const n = state.order.length;
  state.pos = ((orderPos % n) + n) % n;
  renderTrack();
  if (!yt || !state.ready) return;
  const t = currentTrack();
  yt.loadVideoById(t.id);
  if (t.start) yt.seekTo(t.start, true);
  yt.playVideo();
}

function toggle() {
  if (!yt || !state.ready) return;
  state.playing ? yt.pauseVideo() : yt.playVideo();
}
function go(delta) { if (state.order.length) playAt(state.pos + delta); }

el.play.addEventListener('click', toggle);
el.prev.addEventListener('click', () => {
  const t = currentTrack();
  const startTime = t.start || 0;
  if (yt && (yt.getCurrentTime() || 0) > startTime + 3) yt.seekTo(startTime, true);
  else go(-1);
});
el.next.addEventListener('click', () => go(1));

el.shuffleBtn.addEventListener('click', () => {
  const keepTrackIdx = state.order[state.pos];
  state.shuffleOn = !state.shuffleOn;
  el.shuffleBtn.classList.toggle('is-on', state.shuffleOn);
  state.order = state.shuffleOn ? shuffleArr(buildOrder()) : buildOrder();
  state.pos = Math.max(0, state.order.indexOf(keepTrackIdx));
  renderTrack();
});

el.repeatBtn.addEventListener('click', () => {
  state.repeatOn = !state.repeatOn;
  el.repeatBtn.classList.toggle('is-on', state.repeatOn);
});

el.nightBtn.addEventListener('click', () => {
  const isDark = document.body.classList.toggle('dark-mode');
  el.nightBtn.classList.toggle('is-on', isDark);
  el.nightBtn.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
});

if (localStorage.getItem('darkMode') === 'enabled') {
  document.body.classList.add('dark-mode');
  el.nightBtn.classList.add('is-on');
  el.nightBtn.textContent = '☀️';
}

el.ytBtn.addEventListener('click', () => {
  const t = currentTrack();
  if (t) window.open(`https://www.youtube.com/watch?v=${t.id}`, '_blank');
});

/* ── Seek Bar Click & Drag Jump Support ──────────────────── */
function fractionFromEvent(e) {
  const r = el.bar.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  return Math.min(1, Math.max(0, x / r.width));
}

el.bar.addEventListener('pointerdown', e => {
  if (!yt) return;
  state.scrubbing = true;
  el.bar.setPointerCapture(e.pointerId);
  const frac = fractionFromEvent(e);
  el.fill.style.width = `${frac * 100}%`;
  el.knob.style.left = `${frac * 100}%`;
});

el.bar.addEventListener('pointermove', e => {
  if (!state.scrubbing) return;
  const frac = fractionFromEvent(e);
  el.fill.style.width = `${frac * 100}%`;
  el.knob.style.left = `${frac * 100}%`;
});

el.bar.addEventListener('pointerup', e => {
  if (!state.scrubbing) return;
  state.scrubbing = false;
  const dur = yt?.getDuration?.() || 0;
  const t = currentTrack();
  const start = t.start || 0;
  const end = t.end || dur;
  if (dur) {
    const targetTime = start + (end - start) * fractionFromEvent(e);
    yt.seekTo(targetTime, true);
  }
});

/* ── Real-time Progress Update ───────────────────────────── */
setInterval(() => {
  if (!yt || state.scrubbing || typeof yt.getCurrentTime !== 'function') return;
  const cur = yt.getCurrentTime() || 0;
  const dur = yt.getDuration() || 0;
  const t = currentTrack();
  if (!t) return;

  const start = t.start || 0;
  const end = t.end || dur;

  if (t.end && cur >= t.end) {
    state.repeatOn ? playAt(state.pos) : go(1);
    return;
  }

  if (end > start) {
    const progressPercent = Math.min(100, Math.max(0, ((cur - start) / (end - start)) * 100));
    el.fill.style.width = `${progressPercent}%`;
    el.knob.style.left = `${progressPercent}%`;
  }

  el.cur.textContent = fmt(cur - start > 0 ? cur - start : 0);
  el.dur.textContent = fmt(end - start);
}, 500);

function tickClock(){
  el.clock.textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
}
tickClock();
setInterval(tickClock, 15000);

(function driftListeners(){
  const MIN = 27, MAX = 35;
  let count = MIN + Math.floor(Math.random() * (MAX - MIN));
  el.liveCount.textContent = count;
  const step = () => {
    const mid = (MIN + MAX) / 2;
    const up = Math.random() < (count < mid ? 0.6 : 0.4);
    count = Math.max(MIN, Math.min(MAX, count + (up ? 1 : -1)));
    el.liveCount.textContent = count;
   const step = () => {
    const mid = (MIN + MAX) / 2;
    const up = Math.random() < (count < mid ? 0.6 : 0.4);
    count = Math.max(MIN, Math.min(MAX, count + (up ? 1 : -1)));
    el.liveCount.textContent = count;
    setTimeout(step, 3000 + Math.random() * 4000);
  };
  setTimeout(step, 2500);
})();

window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('yt-player', {
    height: '1', width: '1',
    videoId: 'NlWmLCZM7gA',
    playerVars: { playsinline: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0 },
    events: {
      onReady: () => { state.ready = true; el.play.disabled = false; },
      onStateChange: e => {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) renderPlaying(true);
        else if (e.data === S.PAUSED) renderPlaying(false);
        else if (e.data === S.ENDED) state.repeatOn ? playAt(state.pos) : go(1);
      },
      onError: () => go(1),
    },
  });
};

loadTrackData();
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Wala — Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.8s ease-in-out;
        }

        /* Top Tabs */
        .tabs-container {
            display: flex;
            gap: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            margin-top: 10px;
        }

        .tab-btn {
            padding: 8px 22px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: transparent;
            color: #b3b3b3;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: #ff9800;
            color: #000000;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        /* Center Main Content */
        .main-content {
            text-align: center;
            z-index: 5;
        }

        .main-heading {
            font-size: 42px;
            font-weight: 900;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.9);
        }

        /* Scrollable Playlist Drawer (jaise screenshot mein hai) */
        .playlist-drawer {
            background: rgba(24, 24, 24, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            max-height: 180px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            display: none; /* Button dabane par open hoga */
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        .playlist-drawer.is-open {
            display: block;
        }

        .playlist-item {
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .playlist-item:hover, .playlist-item.is-current {
            background: rgba(255, 152, 0, 0.3);
        }

        .playlist-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .playlist-item small {
            color: #b3b3b3;
            font-size: 11px;
        }

        /* Bottom Glass Player Card */
        .player-card {
            background: rgba(24, 24, 24, 0.85);
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            border-radius: 35px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cover-img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
        }

        .track-details {
            flex-grow: 1;
            overflow: hidden;
            text-align: left;
        }

        .track-details h4 {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-details p {
            font-size: 12px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        .play-btn {
            background: #ffffff;
            color: #000000;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            font-size: 13px;
            color: #b3b3b3;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            margin-top: 10px;
            letter-spacing: 1px;
            z-index: 10;
        }

        #youtube-container {
            display: none;
        }
    </style>
</head>
<body style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.85)), url('https://i.ibb.co/pSwH5rG/image1.jpg');">

    <!-- Top Tabs (Playlists / Single Songs) -->
    <div class="tabs-container">
        <button class="tab-btn active" id="playlist-btn">Playlists</button>
        <button class="tab-btn" id="single-btn">Single Songs</button>
    </div>

    <!-- Center Heading -->
    <div class="main-content">
        <h1 class="main-heading" id="hero-title">राजू मिस्त्री</h1>
    </div>

    <!-- Scrollable Playlist Drawer (Jo screenshot jaisa dikhega) -->
    <div class="playlist-drawer" id="playlist-drawer">
        <div id="playlist-items-container">
            <!-- Tracks dynamically JavaScript se yahan aayenge -->
        </div>
    </div>

    <!-- Bottom Glass Player Card -->
    <div class="player-card">
        <img id="cover" class="cover-img" src="" alt="Thumbnail">
        <div class="track-details">
            <h4 id="title">Loading...</h4>
            <p id="artist">YouTube Stream</p>
        </div>
        
        <div class="controls-group">
            <button class="ctrl-btn" id="prev" title="Previous">⏮️</button>
            <button class="play-btn" id="play">▶</button>
            <button class="ctrl-btn" id="next" title="Next">⏭️</button>
            <!-- List/Drawer Toggle Button -->
            <button class="ctrl-btn" id="list-toggle-btn" title="Open Playlist">📂</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Made by Harsh
    </footer>

    <!-- Hidden YouTube Player -->
    <div id="youtube-container">
        <div id="yt-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
